service:
  flush: 1
  daemon: off
  log_level: info

  storage.path: ${INTELSOC_FLUENTBIT_STORAGE}
  storage.sync: full
  storage.checksum: on

pipeline:
  inputs:

    # Windows Application log
    - name: winevtlog
      tag: intelsoc.windows.application
      channels: Application
      interval_sec: 1
      read_existing_events: false
      db: ${INTELSOC_FLUENTBIT_APPLICATION_DB}
      storage.type: filesystem

    # Windows System log
    - name: winevtlog
      tag: intelsoc.windows.system
      channels: System
      interval_sec: 1
      read_existing_events: false
      db: ${INTELSOC_FLUENTBIT_SYSTEM_DB}
      storage.type: filesystem

    # Important Windows Security events
    - name: winevtlog
      tag: intelsoc.windows.security
      channels: Security
      interval_sec: 1
      read_existing_events: false
      event_query: '*[System[(EventID=4624 or EventID=4625 or EventID=4740)]]'
      db: ${INTELSOC_FLUENTBIT_SECURITY_DB}
      storage.type: filesystem

  outputs:

    - name: http
      match: 'intelsoc.windows.*'

      host: Pareezyy.local
      port: 8445
      uri: /api/v1/events/windows

      format: json

      tls: on
      tls.verify: off

      header:
        - 'X-IntelSOC-Key ${INTELSOC_INGEST_API_KEY}'
        - 'X-Device-ID ${INTELSOC_DEVICE_ID}'

      retry_limit: false